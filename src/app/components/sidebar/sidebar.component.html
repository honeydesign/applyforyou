<aside class="sidebar">

  <a routerLink="/" class="logo-row">
    <div class="logo-box">
      <svg width="22" height="22" viewBox="0 0 44 44" fill="none">
        <rect x="4" y="8" width="18" height="24" rx="4" fill="white" opacity="0.95"/>
        <line x1="9" y1="15" x2="17" y2="15" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <line x1="9" y1="20" x2="17" y2="20" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <line x1="9" y1="25" x2="13" y2="25" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 30 L24 16 Q24 12 28 11 Q32 10 32 14 L32 16 Q34 16 34 20 L34 24 Q34 28 30 29 L24 30 Z" fill="#C4B5FD" stroke="#7C3AED" stroke-width="0.5"/>
      </svg>
    </div>
    <span class="logo-text">Apply<span class="logo-accent">-4-</span>You</span>
  </a>

  <nav class="nav">
    <a routerLink="/dashboard"    routerLinkActive="active" class="nav-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>
    <a routerLink="/activity"     routerLinkActive="active" class="nav-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      AI Activity
    </a>
    <a routerLink="/applications" routerLinkActive="active" class="nav-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Applications
    </a>
    <a routerLink="/profile"      routerLinkActive="active" class="nav-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </a>
    <a routerLink="/preferences"  routerLinkActive="active" class="nav-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      Preferences
    </a>
    <a routerLink="/settings"     routerLinkActive="active" class="nav-item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar">{{ initials }}</div>
      <div class="user-info">
        <div class="user-name">{{ fullName }}</div>
        <div class="user-plan">Free plan</div>
      </div>
    </div>
    <button class="btn-logout" (click)="logout()">Log out</button>
  </div>

</aside>
